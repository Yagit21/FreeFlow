{% extends "base.html" %}

{% block content %}

<h1>Motion Capture</h1>

<div>
    <video id="webcam" autoplay playsinline muted width="640"></video>
</div>

<button id="startButton">
    Start Camera
</button>

<button id="recordButton" disabled>
    Start Recording
</button>

<button id="stopButton" disabled>
    Stop Recording
</button>

<p id="status"></p>

<script src="{{ url_for('static', filename='webcam.js') }}"></script>

{% endblock %}
